[project]
name = "hosoai"
version = "0.1.0"
description = "Hồ Sơ AI backend: find Vietnamese administrative procedures, cite official sources, fill forms."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "sqlmodel>=0.0.21",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "email-validator>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hosoai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# PyMuPDF ships without complete type hints.
module = ["hosoai.forms.fill", "hosoai.forms.learn.*", "hosoai.evals.run"]
disallow_untyped_calls = false
